<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>美剧词库 · Wordloom</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f7f8f5;color:#17221b;font:14px Arial,"PingFang SC",sans-serif}
    .wrap{max-width:430px;margin:0 auto;padding:86px 14px 24px}.brand{font:bold 22px Georgia;color:#2d6b4a;margin-bottom:16px}.brand b{display:inline-grid;place-items:center;background:#2d6b4a;color:#fff;border-radius:8px;width:29px;height:29px;margin-right:8px}
    .nav{position:fixed;z-index:5;left:0;right:0;top:0;padding:10px 12px;background:#fff;border-bottom:1px solid #e1e8e2;display:flex;gap:5px;overflow-x:auto;white-space:nowrap}.nav a{padding:9px 8px;border-radius:7px;color:#607268;text-decoration:none;font-size:12px}.nav .on{background:#e5f1e8;color:#2d6b4a;font-weight:bold}
    .library{background:#fff;border-top:2px solid #26352b;border-bottom:2px solid #26352b}.library h1{font:22px Georgia;margin:0;padding:16px;border-bottom:1px solid #26352b}.word-list{background:#fff}.word-row{padding:15px 16px;border-bottom:1px solid #e5ebe6}.word-row:last-child{border-bottom:0}.word-row .w{font:18px Georgia;margin-bottom:6px}.word-row .m{font-size:14px}.ipa{margin-left:8px;color:#8a978e;font:12px Arial;font-weight:normal}.sound{width:18px;height:18px;margin-left:8px;border:0;background:transparent;color:#789083;cursor:pointer;padding:0;vertical-align:middle}.sound svg{display:block;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><b>A</b>Wordloom</div>
    <nav class="nav"><a href="../listening/">听力词库</a><a class="on" href="../tv/">美剧词库</a><a href="../ielts/">雅思真题词库</a></nav>
    <section class="library"><h1>美剧词库</h1><div class="word-list" id="words"></div></section>
  </main>
  <script>
    const words = [
      ["initial","最初的；起始的","/ɪˈnɪʃəl/"],["a set of sleeves","一套袖套"],["ink","墨水；油墨","/ɪŋk/"],["vault","拱顶；保险库","/vɔːlt/"],["branch manager","分行经理"],["square","广场；正方形","/skweə/"],["armed robbery","持械抢劫"],["a plea of no contest","不抗辩答辩"],["additional","额外的；附加的","/əˈdɪʃənəl/"],["retire","退休；退职","/rɪˈtaɪə/"],["chambers","（法官的）办公室","/ˈtʃeɪmbəz/"],["determine sentencing","决定量刑"],["recess","休庭；休会","/rɪˈses/"],["lob","高抛；吊高球","/lɒb/"],["grenade","手榴弹","/ɡrəˈneɪd/"],["justice","司法；公正","/ˈdʒʌstɪs/"],["given","已知的；特定的","/ˈɡɪvən/"],["inclined","倾向于……的","/ɪnˈklaɪnd/"],["probation","缓刑；试用期","/prəˈbeɪʃən/"],["discharge","释放；解除","/dɪsˈtʃɑːdʒ/"],["commission","委员会；佣金；犯（罪）","/kəˈmɪʃən/"],["malice","恶意","/ˈmælɪs/"],["incumbent","现任者；在职者","/ɪnˈkʌmbənt/"],["incarcerated","被监禁的","/ɪnˈkɑːsəreɪtɪd/"],["counsel","律师；法律顾问","/ˈkaʊnsəl/"],["refrain","克制；避免","/rɪˈfreɪn/"],["interrupt","打断；中断","/ˌɪntəˈrʌpt/"],["facility","设施；场所","/fəˈsɪləti/"],["penitentiary","监狱","/ˌpenɪˈtenʃəri/"],["sentence","判刑；刑期","/ˈsentəns/"],["eligible","有资格的","/ˈelɪdʒəbəl/"],["parole","假释","/pəˈrəʊl/"],["banks","银行；河岸（复数）","/bæŋks/"],["religious","宗教的；虔诚的","/rɪˈlɪdʒəs/"],["Ten Commandments","十诫"],["gotcha","（口语）抓到你了；明白了"],["radar","雷达","/ˈreɪdɑː/"],["crack","裂缝；猛击；破解","/kræk/"],["air conditioner","空调"],["deuce","平局；该死（俚语）","/djuːs/"],["bleachers","露天看台","/ˈbliːtʃəz/"],["weight pile","举重器材区"],["badge","徽章；警徽","/bædʒ/"],["deny","否认；拒绝","/dɪˈnaɪ/"],["parachute","降落伞","/ˈpærəʃuːt/"],["snowflake","雪花；（俚）脆弱敏感的人","/ˈsnəʊfleɪk/"],["VP","副总裁；副总统"],["chapel","小教堂","/ˈtʃæpəl/"],["P.I.","私家侦探"],["scraping","刮擦；刮下的碎屑","/ˈskreɪpɪŋ/"],["mattresses","床垫（复数）","/ˈmætrəsɪz/"],["sniffing","嗅；闻","/ˈsnɪfɪŋ/"],["motion","动议；动作","/ˈməʊʃən/"],["execute","执行；处决","/ˈeksɪkjuːt/"],["appeals","上诉（复数）","/əˈpiːlz/"],["courts","法院（复数）","/kɔːts/"],["context","语境；背景","/ˈkɒntekst/"],["liquor store","酒类专卖店"],["classy","有品位的；高级的","/ˈklɑːsi/"],["propose","提议；求婚","/prəˈpəʊz/"],["spot","地点；发现","/spɒt/"],["ferry","渡轮","/ˈferi/"],["passion","热情；激情","/ˈpæʃən/"],["dope","毒品；（俚）很棒","/dəʊp/"],["hire","雇用；租用","/ˈhaɪə/"],["beat it","滚开；快走"],["ought","应该","/ɔːt/"],["assistance","帮助；援助","/əˈsɪstəns/"],["mull it over","仔细考虑"],["messing","胡闹；瞎弄","/ˈmesɪŋ/"],["tattoo","文身","/təˈtuː/"],["diabetic","糖尿病患者；糖尿病的","/ˌdaɪəˈbetɪk/"],["needles","针头（复数）","/ˈniːdəlz/"],["no less","不少于；同样地"],["senior quote","毕业纪念册赠言"],["hypos","皮下注射针；低血糖（复数）","/ˈhaɪpəʊz/"],["junkie","瘾君子","/ˈdʒʌŋki/"],["insulin","胰岛素","/ˈɪnsjəlɪn/"],["administer","施用；管理","/ədˈmɪnɪstə/"],["headquarters","总部","/ˌhedˈkwɔːtəz/"],["in the fold","成为圈内一员"],["prep school","大学预科学校"],["apparently","显然；据说","/əˈpærəntli/"],["sinful","有罪的；罪恶的","/ˈsɪnfəl/"],["crucified","被钉十字架处死的","/ˈkruːsɪfaɪd/"],["formal","正式的","/ˈfɔːməl/"],["greeting card","贺卡"],["pull the trigger","扣动扳机；作出最终决定"]
    ];
    const escapeHtml = value => value.replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    document.querySelector("#words").innerHTML = words.map(([word, meaning, ipa]) => `<div class="word-row"><div class="w">${escapeHtml(word)}${ipa ? `<span class="ipa">${ipa}</span>` : ""}</div><div class="m">${escapeHtml(meaning)}</div></div>`).join("");
  </script>
  <link rel="stylesheet" href="../word-actions.css">
  <script src="../word-actions.js"></script>
</body>
</html>
